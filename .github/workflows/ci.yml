name: CI - Tests Automatisés et Sécurité

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ⬇️ NOUVEAU : Restriction des permissions (Q76) ⬇️
permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: arij
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: portfolio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Installation des dépendances API
        working-directory: ./api
        run: npm install

      - name: Génération du client Prisma
        working-directory: ./api
        run: npx prisma generate

      - name: Application des migrations Prisma
        working-directory: ./api
        env:
          DATABASE_URL: postgresql://arij:password123@localhost:5432/portfolio_db?schema=public
        run: npx prisma migrate deploy

      - name: Exécution des tests API
        working-directory: ./api
        env:
          DATABASE_URL: postgresql://arij:password123@localhost:5432/portfolio_db?schema=public
          NODE_ENV: test
        run: npm run test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nextjs-portfolio/package-lock.json

      - name: Installation des dépendances Frontend
        working-directory: ./nextjs-portfolio
        run: npm install

      - name: Exécution des tests Frontend
        working-directory: ./nextjs-portfolio
        run: npm run test

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # 1. SCAN DES SECRETS (GITLEAKS)
      - name: Scan des secrets (Gitleaks)
        run: |
          docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:latest \
          detect --source /repo --no-git --report-format json --exit-code 1

      # 2. SAST (SEMGREP)
      - name: Analyse SAST (Semgrep)
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src semgrep/semgrep:latest \
          semgrep scan --config auto \
          --exclude 'node_modules' --exclude '.next' --exclude 'dist' --exclude '.vagrant' \
          --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
          --exclude-rule typescript.react.security.react-insecure-request.react-insecure-request \
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring || true

      # 3. CONTRÔLE DES DÉPENDANCES (NPM AUDIT)
      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contrôle des dépendances API (npm audit)
        working-directory: ./api
        run: |
          npm install
          npm audit --audit-level=high || true

      - name: Contrôle des dépendances Frontend (npm audit)
        working-directory: ./nextjs-portfolio
        run: |
          npm install
          npm audit --audit-level=high || true

  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Construction de l'image Docker de l'API
        run: docker build -t devsecops-api:latest ./api

      - name: Construction de l'image Docker du Frontend
        run: docker build -t devsecops-portfolio:latest ./nextjs-portfolio

      # SCAN TRIVY
      - name: Scan Trivy de l'image API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Trivy de l'image Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-portfolio:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
