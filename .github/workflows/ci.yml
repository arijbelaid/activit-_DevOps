name: CI - Tests Automatisés et Sécurité

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permissions globales
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API Dependencies
        run: cd api && npm install
      - name: Run API Tests
        run: cd api && npm test -- __tests__/api.test.js

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Frontend Dependencies
        run: cd nextjs-portfolio && npm install
      - name: Run Frontend Tests
        run: cd nextjs-portfolio && npm test

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tout l'historique Git pour Gitleaks

      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (Dependencies)
        run: |
          cd api && npm audit --audit-level=high || true
          cd ../nextjs-portfolio && npm audit --audit-level=high || true

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend, security-scans]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Image
        run: docker build -t devsecops-api:${{ github.sha }} ./api
      - name: Build Frontend Image
        run: docker build -t devsecops-portfolio:${{ github.sha }} ./nextjs-portfolio

  # ⬇️ JOB Q101 : ATTESTATION DE PROVENANCE ⬇️
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image to GHCR
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository }}/devsecops-api:${{ github.sha }}

      - name: Generate build provenance attestation for API
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/devsecops-api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Build and push Frontend image to GHCR
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs-portfolio
          push: true
          tags: ghcr.io/${{ github.repository }}/devsecops-portfolio:${{ github.sha }}

      - name: Generate build provenance attestation for Frontend
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/devsecops-portfolio
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

  # ⬇️ JOB Q104 : VÉRIFICATION STRICTE DE LA PROVENANCE (REFUS SI NON ATTESTÉE) ⬇️
  verify-images:
    runs-on: ubuntu-latest
    needs: build-and-attest
    steps:
      - name: Verify API Image Attestation (Enforce)
        run: gh attestation verify oci://ghcr.io/${{ github.repository }}/devsecops-api:${{ github.sha }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Frontend Image Attestation (Enforce)
        run: gh attestation verify oci://ghcr.io/${{ github.repository }}/devsecops-portfolio:${{ github.sha }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
