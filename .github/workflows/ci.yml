name: CI - Tests Automatisés et Sécurité

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ⬇️ PERMISSIONS REQUISES POUR L'ATTESTATION (Q101) ⬇️
permissions:
  contents: read
  packages: write      # Pour pousser l'image sur GitHub Container Registry (GHCR)
  id-token: write      # Pour générer le jeton OIDC de signature
  attestations: write  # Pour écrire l'attestation dans GitHub

jobs:
  # ... (Vos autres jobs : test-api, test-frontend, etc. restent inchangés) ...

  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Construction et push de l'image API vers GHCR
      - name: Build and push API image to GHCR
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository }}/devsecops-api:${{ github.sha }}
          # L'action extrait automatiquement le digest (empreinte unique) de l'image

      # 2. Génération de l'attestation pour l'API (Q101)
      - name: Generate build provenance attestation for API
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/devsecops-api
          subject-digest: ${{ steps.build-api.outputs.digest }} # Utilisation du digest généré
          push-to-registry: true

      # 3. Construction et push de l'image Frontend vers GHCR
      - name: Build and push Frontend image to GHCR
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs-portfolio
          push: true
          tags: ghcr.io/${{ github.repository }}/devsecops-portfolio:${{ github.sha }}

      # 4. Génération de l'attestation pour le Frontend (Q101)
      - name: Generate build provenance attestation for Frontend
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/devsecops-portfolio
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true
