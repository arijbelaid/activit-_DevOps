---
- name: Déployer le DevSecOps Portfolio avec Docker Compose
  hosts: all
  become: true
  vars:
    repo_url: "https://github.com/arijbelaid/cv-onepage.git"
    app_dir: "/home/vagrant/cv-onepage"

  tasks:
    - name: Mettre à jour le cache APT
      apt:
        update_cache: yes

    - name: Installer les dépendances (curl, gnupg, etc.)
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Créer le dossier des clés APT
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la clé GPG officielle de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Mettre à jour le cache APT après ajout du dépôt
      apt:
        update_cache: yes

    - name: Installer Git et Docker Compose
      apt:
        name:
          - git
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: S'assurer que le service Docker est démarré
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Cloner ou mettre à jour le dépôt du portfolio
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    # ⬇️ LES TÂCHES MANQUANTES SONT ICI ⬇️
    - name: Corriger les permissions du dépôt cloné
      file:
        path: "{{ app_dir }}"
        owner: vagrant
        group: vagrant
        recurse: yes

    - name: Créer le fichier .env avec la bonne IP pour l'API
      copy:
        dest: "{{ app_dir }}/nextjs-portfolio/.env"
        content: "NEXT_PUBLIC_API_URL=http://192.168.159.129:5000\n"

    - name: Lancer les conteneurs avec Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always
