services:
  api:
    build: ./api
    image: devsecops-api
    container_name: devsecops-api-container
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=arij
      - DB_PASSWORD=password123
      - DB_NAME=portfolio_db 
      - DATABASE_URL=postgresql://arij:password123@db:5432/portfolio_db?schema=public 
    depends_on:
      - db
    networks:
      - devsecops-network

  frontend:
    build: ./nextjs-portfolio
    image: devsecops-portfolio
    container_name: devsecops-frontend-container
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.159.15:5000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - devsecops-network

  db:
    image: postgres:15-alpine
    container_name: devsecops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arij
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devsecops-network

networks:
  devsecops-network:
    driver: bridge

volumes:
  postgres_data:
