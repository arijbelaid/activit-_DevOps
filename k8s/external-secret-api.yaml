apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: devsecops-portfolio
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: api/config
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: api/config
        property: JWT_SECRET
