apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: floci-backend
  namespace: devsecops-portfolio
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: floci-credentials
            key: secret-key
