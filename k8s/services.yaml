apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: devsecops-portfolio
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: devsecops-portfolio
spec:
  selector:
    app: api
  ports:
  - port: 5000
    targetPort: 5000
