apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: floci-api-key
  namespace: devsecops-portfolio
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: floci-backend
    kind: SecretStore
  target:
    name: floci-api-key
  data:
    - secretKey: API_KEY
      remoteRef:
        key: floci/api-key
        property: API_KEY
